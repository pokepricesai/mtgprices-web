name: Phase 4B — Forge Simulation Mode POC
# Manual-only. Downloads a PINNED Forge release, runs sim mode against
# our exported fixture decks, and captures real timings/memory. No
# integration into production. Never runs on push.
on:
  workflow_dispatch:
    inputs:
      forge_tag:
        description: 'Forge release tag'
        required: true
        default: 'forge-2.0.14'
      seed:
        description: 'RNG seed for reproducibility'
        required: true
        default: '424242'

permissions:
  contents: read

jobs:
  forge-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORGE_TAG: ${{ inputs.forge_tag }}
      SEED: ${{ inputs.seed }}
      JAVA_TOOL_OPTIONS: -Xmx4096m -Dfile.encoding=UTF-8 -Dio.netty.tryReflectionSetAccessible=true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Environment probe
        run: |
          java -version
          node --version
          uname -a
          cat /proc/cpuinfo | grep "model name" | head -1
          free -h
          df -h /tmp
          # /usr/bin/time -v (GNU) supports -v for verbose stats.
          /usr/bin/time --version

      - name: Download pinned Forge release
        run: |
          mkdir -p forge-poc/dist
          cd forge-poc/dist
          gh release download "$FORGE_TAG" --repo Card-Forge/forge \
            --pattern "forge-installer-${FORGE_TAG#forge-}.tar.bz2"
          ls -lh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure download size
        run: |
          echo "Installer file size:"
          du -sh forge-poc/dist/*.tar.bz2
          echo "Installer file size (bytes):"
          stat --printf="%s\n" forge-poc/dist/*.tar.bz2

      - name: Extract Forge
        run: |
          cd forge-poc/dist
          tar -xjf "forge-installer-${FORGE_TAG#forge-}.tar.bz2"
          echo "Extracted size:"
          du -sh .
          ls -la
          echo "Main jar size:"
          du -sh forge-gui-desktop-*-jar-with-dependencies.jar

      - name: Generate .dck fixtures
        run: node scripts/phase4b-generate-test-dcks.mjs

      - name: Verify Simulation Mode help + argument parsing
        run: |
          cd forge-poc/dist
          # This forces the JVM to initialise and print the help message
          # to confirm the CLI works. It exits ~1s after JVM start.
          set +e
          /usr/bin/time -v java -jar forge-gui-desktop-*-jar-with-dependencies.jar sim 2>&1 | tee ../help-output.txt || true
          echo ""
          echo "---parsed help---"
          grep -E "^Syntax|^\ts?im" ../help-output.txt || echo "(help text not matched — may still be fine, see raw output)"

      - name: Run — 1 Modern game (Burn vs Green Stompy)
        id: run1
        run: |
          cd forge-poc/dist
          mkdir -p ../logs
          echo "=== 1-game constructed run ===" | tee ../logs/run-1game.txt
          /usr/bin/time -v \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s "$SEED" \
              -c 60 \
              -n 1 \
              >> ../logs/run-1game.txt 2>&1 &
          FORGE_PID=$!
          wait $FORGE_PID
          FORGE_EXIT=$?
          echo "forge exit: $FORGE_EXIT"
          tail -40 ../logs/run-1game.txt

      - name: Run — 10 Modern games (Burn vs Green Stompy)
        run: |
          cd forge-poc/dist
          echo "=== 10-game constructed run ===" | tee ../logs/run-10games.txt
          /usr/bin/time -v \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s "$SEED" \
              -c 60 \
              -n 10 \
              -q \
              >> ../logs/run-10games.txt 2>&1
          echo "10-game tail:"
          tail -30 ../logs/run-10games.txt

      - name: Run — 100 Modern games (Burn vs Green Stompy)
        run: |
          cd forge-poc/dist
          echo "=== 100-game constructed run ===" | tee ../logs/run-100games.txt
          /usr/bin/time -v \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s "$SEED" \
              -c 60 \
              -n 100 \
              -q \
              >> ../logs/run-100games.txt 2>&1 || true
          echo "100-game tail:"
          tail -30 ../logs/run-100games.txt

      - name: Run — deterministic replay probe (seed X twice → identical result)
        id: replay
        run: |
          cd forge-poc/dist
          echo "=== deterministic replay ===" > ../logs/replay.txt
          for run in a b; do
            echo "--- run $run ---" >> ../logs/replay.txt
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s 314159 \
              -c 60 \
              -n 3 \
              -q \
              >> ../logs/replay.txt 2>&1 || true
          done
          echo "---"
          echo "Comparing the two runs (Game Result lines only):"
          grep "^Game Result:" ../logs/replay.txt || echo "(no Game Result lines matched)"

      - name: Run — Commander (Krenko mirror)
        run: |
          cd forge-poc/dist
          echo "=== Commander single game ===" | tee ../logs/run-commander.txt
          /usr/bin/time -v \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_krenko_goblins_99.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_krenko_goblins_99.dck" \
              -f Commander \
              -s "$SEED" \
              -c 120 \
              -n 1 \
              >> ../logs/run-commander.txt 2>&1 || echo "commander run may have thrown — see log"
          tail -60 ../logs/run-commander.txt

      - name: Parse outputs
        run: |
          echo "=== parser: 1 game ==="
          node scripts/phase4b-parse-forge-output.mjs forge-poc/logs/run-1game.txt --json > forge-poc/parsed-1game.json || echo "parse 1 failed"
          jq '.aggregate' forge-poc/parsed-1game.json 2>&1 || cat forge-poc/parsed-1game.json
          echo ""
          echo "=== parser: 10 games ==="
          node scripts/phase4b-parse-forge-output.mjs forge-poc/logs/run-10games.txt --json > forge-poc/parsed-10games.json || echo "parse 10 failed"
          jq '.aggregate' forge-poc/parsed-10games.json 2>&1 || cat forge-poc/parsed-10games.json
          echo ""
          echo "=== parser: 100 games ==="
          node scripts/phase4b-parse-forge-output.mjs forge-poc/logs/run-100games.txt --json > forge-poc/parsed-100games.json || echo "parse 100 failed"
          jq '.aggregate' forge-poc/parsed-100games.json 2>&1 || cat forge-poc/parsed-100games.json
          echo ""
          echo "=== parser: commander ==="
          node scripts/phase4b-parse-forge-output.mjs forge-poc/logs/run-commander.txt --json > forge-poc/parsed-commander.json || echo "parse cmdr failed"
          jq '.aggregate' forge-poc/parsed-commander.json 2>&1 || cat forge-poc/parsed-commander.json

      - name: Summary
        if: always()
        run: |
          echo "=== Phase 4B Forge POC — summary ===" | tee forge-poc/summary.txt
          echo "Forge release: $FORGE_TAG" | tee -a forge-poc/summary.txt
          echo "Seed: $SEED" | tee -a forge-poc/summary.txt
          echo "Runner: $(uname -a)" | tee -a forge-poc/summary.txt
          echo "Java: $(java -version 2>&1 | head -1)" | tee -a forge-poc/summary.txt
          echo ""
          echo "== Installer size ==" | tee -a forge-poc/summary.txt
          du -sh forge-poc/dist/*.tar.bz2 2>/dev/null | tee -a forge-poc/summary.txt
          echo "" | tee -a forge-poc/summary.txt
          echo "== Extracted size ==" | tee -a forge-poc/summary.txt
          du -sh forge-poc/dist 2>/dev/null | tee -a forge-poc/summary.txt

      - name: Upload logs + parsed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-forge-poc-artifacts
          path: |
            forge-poc/logs/**
            forge-poc/parsed-*.json
            forge-poc/summary.txt
            forge-poc/decks/**
          retention-days: 14
