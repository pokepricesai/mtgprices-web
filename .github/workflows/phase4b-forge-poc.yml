name: Phase 4B — Forge Simulation Mode POC
# Manual-only. Downloads a PINNED Forge release, runs sim mode against
# our exported fixture decks, and captures real timings/memory. No
# integration into production. Never runs on push.
on:
  workflow_dispatch:
    inputs:
      forge_tag:
        description: 'Forge release tag'
        required: true
        default: 'forge-2.0.14'
      seed:
        description: 'RNG seed for reproducibility'
        required: true
        default: '424242'

permissions:
  contents: read

jobs:
  forge-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORGE_TAG: ${{ inputs.forge_tag }}
      SEED: ${{ inputs.seed }}
      JAVA_TOOL_OPTIONS: -Xmx4096m -Dfile.encoding=UTF-8 -Dio.netty.tryReflectionSetAccessible=true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Environment probe
        run: |
          java -version
          node --version
          uname -a
          grep "model name" /proc/cpuinfo | head -1
          free -h
          df -h /tmp
          /usr/bin/time --version

      - name: Download pinned Forge release
        run: |
          mkdir -p forge-poc/dist
          cd forge-poc/dist
          gh release download "$FORGE_TAG" --repo Card-Forge/forge \
            --pattern "forge-installer-${FORGE_TAG#forge-}.tar.bz2"
          ls -lh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure download size
        run: |
          echo "Installer file size:"
          du -sh forge-poc/dist/*.tar.bz2
          stat --printf="Installer bytes: %s\n" forge-poc/dist/*.tar.bz2

      - name: Extract Forge
        run: |
          cd forge-poc/dist
          tar -xjf "forge-installer-${FORGE_TAG#forge-}.tar.bz2"
          echo "Extracted size:"
          du -sh .
          ls -la | head -20
          echo "Main jar size:"
          du -sh forge-gui-desktop-*-jar-with-dependencies.jar
          echo "Cardsfolder present in jar?"
          unzip -l forge-gui-desktop-*-jar-with-dependencies.jar | grep -c cardsfolder || true

      - name: Generate .dck fixtures
        run: |
          node scripts/phase4b-generate-test-dcks.mjs
          echo "----- burn deck -----"
          cat forge-poc/decks/phase4b_burn_60.dck
          echo "----- stompy deck -----"
          cat forge-poc/decks/phase4b_green_stompy_60.dck | head -20

      - name: Forge help probe (verify CLI works at all)
        # Run "sim" with no args → argumentHelp() should print syntax
        # and exit 0. This isolates JVM/init issues from arg-parsing.
        # continue-on-error so we always upload artifacts.
        continue-on-error: true
        run: |
          set +e
          cd forge-poc/dist
          echo "=== forge sim (no args → help) ===" | tee "$GITHUB_WORKSPACE/forge-poc/logs/help.txt"
          mkdir -p "$GITHUB_WORKSPACE/forge-poc/logs"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/forge-poc/logs/help.time.txt" \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar sim 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/help.txt"
          echo ""
          echo "---"
          echo "help.time.txt:"
          cat "$GITHUB_WORKSPACE/forge-poc/logs/help.time.txt"

      - name: Run — 1 Modern game (Burn vs Green Stompy)
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/forge-poc/logs"
          cd forge-poc/dist
          echo "=== 1-game constructed run ===" | tee "$GITHUB_WORKSPACE/forge-poc/logs/run-1game.txt"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/forge-poc/logs/run-1game.time.txt" \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s "$SEED" \
              -c 60 \
              -n 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/run-1game.txt"
          echo ""
          echo "--- time report ---"
          cat "$GITHUB_WORKSPACE/forge-poc/logs/run-1game.time.txt" || true

      - name: Run — 10 Modern games
        continue-on-error: true
        run: |
          set +e
          cd forge-poc/dist
          echo "=== 10-game constructed run ===" | tee "$GITHUB_WORKSPACE/forge-poc/logs/run-10games.txt"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/forge-poc/logs/run-10games.time.txt" \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s "$SEED" \
              -c 60 \
              -n 10 \
              -q \
              2>&1 | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/run-10games.txt"
          echo "--- time report ---"
          cat "$GITHUB_WORKSPACE/forge-poc/logs/run-10games.time.txt" || true

      - name: Run — 100 Modern games
        continue-on-error: true
        run: |
          set +e
          cd forge-poc/dist
          echo "=== 100-game constructed run ===" | tee "$GITHUB_WORKSPACE/forge-poc/logs/run-100games.txt"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/forge-poc/logs/run-100games.time.txt" \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s "$SEED" \
              -c 60 \
              -n 100 \
              -q \
              2>&1 | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/run-100games.txt"
          echo "--- time report ---"
          cat "$GITHUB_WORKSPACE/forge-poc/logs/run-100games.time.txt" || true

      - name: Run — deterministic replay probe
        continue-on-error: true
        run: |
          set +e
          cd forge-poc/dist
          echo "=== deterministic replay (seed 314159, n=3, twice) ===" \
            | tee "$GITHUB_WORKSPACE/forge-poc/logs/replay.txt"
          for run in a b; do
            echo "--- run $run ---" | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/replay.txt"
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_burn_60.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_green_stompy_60.dck" \
              -f Constructed \
              -s 314159 \
              -c 60 \
              -n 3 \
              -q \
              2>&1 | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/replay.txt"
          done
          echo "---"
          echo "Game Result lines:"
          grep "^Game Result:" "$GITHUB_WORKSPACE/forge-poc/logs/replay.txt" || echo "(no Game Result lines matched)"

      - name: Run — Commander (Krenko mirror)
        continue-on-error: true
        run: |
          set +e
          cd forge-poc/dist
          echo "=== Commander single game ===" | tee "$GITHUB_WORKSPACE/forge-poc/logs/run-commander.txt"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/forge-poc/logs/run-commander.time.txt" \
            java -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_krenko_goblins_99.dck" \
              -d "$GITHUB_WORKSPACE/forge-poc/decks/phase4b_krenko_goblins_99.dck" \
              -f Commander \
              -s "$SEED" \
              -c 120 \
              -n 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/forge-poc/logs/run-commander.txt"
          echo "--- time report ---"
          cat "$GITHUB_WORKSPACE/forge-poc/logs/run-commander.time.txt" || true

      - name: Parse outputs
        continue-on-error: true
        run: |
          set +e
          for f in run-1game run-10games run-100games run-commander replay; do
            path="forge-poc/logs/${f}.txt"
            if [ ! -f "$path" ]; then echo "skip $f — no log"; continue; fi
            echo "=== parser: $f ==="
            node scripts/phase4b-parse-forge-output.mjs "$path" --json > "forge-poc/parsed-${f}.json" 2>&1 || echo "(parser failed)"
            if command -v jq >/dev/null; then
              jq '.aggregate' "forge-poc/parsed-${f}.json" 2>&1 || cat "forge-poc/parsed-${f}.json"
            else
              head -40 "forge-poc/parsed-${f}.json"
            fi
            echo ""
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "=== Phase 4B Forge POC — summary ==="
            echo "Forge release: $FORGE_TAG"
            echo "Seed: $SEED"
            echo "Runner: $(uname -a)"
            echo "Java: $(java -version 2>&1 | head -1)"
            echo ""
            echo "== Installer size =="
            du -sh forge-poc/dist/*.tar.bz2 2>/dev/null || echo "(none)"
            echo "== Extracted size =="
            du -sh forge-poc/dist 2>/dev/null || echo "(none)"
            echo ""
            echo "== File sizes =="
            ls -lh forge-poc/dist/*.jar 2>/dev/null || true
            echo ""
            echo "== Log line counts =="
            for f in forge-poc/logs/*.txt; do
              [ -f "$f" ] && wc -l "$f"
            done
            echo ""
            echo "== Time reports =="
            for f in forge-poc/logs/*.time.txt; do
              [ -f "$f" ] && { echo "--- $f ---"; grep -E "Elapsed|Maximum resident|User time|System time|Exit" "$f"; }
            done
          } | tee forge-poc/summary.txt

      - name: Upload logs + parsed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-forge-poc-artifacts
          path: |
            forge-poc/logs/**
            forge-poc/parsed-*.json
            forge-poc/summary.txt
            forge-poc/decks/**
          retention-days: 14
